<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Giriş Yap — Kuaför Randevu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/forms.css">
  <style>
    body { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: var(--color-bg); padding: var(--space-6); }
    .auth-card {
      width: 100%; max-width: 420px;
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-xl);
      padding: var(--space-10) var(--space-8);
    }
    .auth-logo {
      display: flex; align-items: center; gap: var(--space-2);
      font-family: var(--font-heading); font-size: var(--font-size-xl);
      color: var(--color-gold); text-decoration: none;
      margin-bottom: var(--space-8);
    }
    .auth-logo-icon {
      width: 32px; height: 32px;
      background: linear-gradient(135deg, var(--color-gold), var(--color-gold-dark));
      border-radius: var(--radius-md);
      display: flex; align-items: center; justify-content: center;
      color: #fff;
    }
    .auth-title { font-size: var(--font-size-2xl); color: var(--color-text); margin-bottom: var(--space-1); }
    .auth-sub   { font-size: var(--font-size-sm); color: var(--color-text-3); margin-bottom: var(--space-8); }
    .auth-footer { text-align: center; font-size: var(--font-size-sm); color: var(--color-text-3); margin-top: var(--space-6); }
    .auth-footer a { color: var(--color-gold); text-decoration: none; }
    .auth-footer a:hover { text-decoration: underline; }
    .back-link { display: inline-flex; align-items: center; gap: var(--space-1); font-size: var(--font-size-sm); color: var(--color-text-3); text-decoration: none; margin-bottom: var(--space-6); }
    .back-link:hover { color: var(--color-text); }
  </style>
</head>
<body>

<div class="auth-card">
  <a href="index.html" class="back-link">← Ana Sayfaya Dön</a>

  <a href="index.html" class="auth-logo">
    <span class="auth-logo-icon">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><line x1="20" y1="4" x2="8.12" y2="15.88"/><line x1="14.47" y1="14.48" x2="20" y2="20"/><line x1="8.12" y1="8.12" x2="12" y2="12"/></svg>
    </span>
    KuaförRandevu
  </a>

  <h1 class="auth-title">Giriş Yap</h1>
  <p class="auth-sub">Randevularınıza erişmek için giriş yapın.</p>

  <form id="giris-form" novalidate>
    <div class="form-group">
      <label class="form-label" for="g-telefon">Telefon <span class="required-mark" aria-hidden="true">*</span></label>
      <input type="tel" class="input" id="g-telefon" placeholder="0555 555 55 55" inputmode="numeric" autocomplete="tel">
      <span class="form-error" id="g-telefon-err"></span>
    </div>
    <div class="form-group">
      <label class="form-label" for="g-sifre">Şifre <span class="required-mark" aria-hidden="true">*</span></label>
      <input type="password" class="input" id="g-sifre" placeholder="••••••" autocomplete="current-password">
      <span class="form-error" id="g-sifre-err"></span>
    </div>
    <button type="submit" class="btn btn-primary" id="btn-giris" style="width:100%;margin-top:var(--space-2);">
      Giriş Yap
    </button>
  </form>

  <div class="auth-footer">
    Hesabınız yok mu? <a href="musteri-kayit.html">Kayıt Ol</a>
  </div>
</div>

<div id="toast-container"></div>

<script src="assets/js/icons.js"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/validation.js"></script>
<script src="assets/js/mask.js"></script>
<script src="assets/js/musteri-giris.js"></script>
</body>
</html>
