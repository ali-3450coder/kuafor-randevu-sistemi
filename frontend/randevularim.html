<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Randevularım — Kuaför Randevu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/forms.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
  <style>
    .appt-nav {
      background: rgba(10,10,10,0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--color-border);
      padding: 0 var(--space-6);
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky; top: 0;
      z-index: var(--z-sticky);
    }
    .appt-nav__logo {
      font-family: var(--font-heading);
      font-size: var(--font-size-lg);
      color: var(--color-gold);
      text-decoration: none;
      display: flex; align-items: center; gap: var(--space-2);
    }
    .appt-nav__user {
      font-size: var(--font-size-sm);
      color: var(--color-text-3);
    }
    .appt-nav__right {
      display: flex; align-items: center; gap: var(--space-4);
    }
    .page-wrap {
      max-width: 800px;
      margin: 0 auto;
      padding: var(--space-8) var(--space-6);
    }
    .page-title {
      font-family: var(--font-heading);
      font-size: var(--font-size-2xl);
      color: var(--color-text);
      margin-bottom: var(--space-2);
    }
    .page-sub {
      font-size: var(--font-size-sm);
      color: var(--color-text-3);
      margin-bottom: var(--space-8);
    }
    /* Randevu karti */
    .randevu-karti {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      padding: var(--space-5);
      margin-bottom: var(--space-4);
      position: relative;
    }
    .randevu-karti--iptal { opacity: 0.65; }
    .randevu-karti__header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: var(--space-3);
      margin-bottom: var(--space-4);
      flex-wrap: wrap;
    }
    .randevu-karti__kod {
      font-family: var(--font-mono);
      font-size: var(--font-size-xs);
      color: var(--color-gold);
      font-weight: var(--font-weight-semibold);
      letter-spacing: 0.06em;
    }
    .randevu-karti__body {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: var(--space-3);
      font-size: var(--font-size-sm);
    }
    .randevu-karti__alan-label {
      font-size: var(--font-size-xs);
      color: var(--color-text-3);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 2px;
    }
    .randevu-karti__alan-deger {
      color: var(--color-text);
      font-weight: var(--font-weight-medium);
    }
    .randevu-karti__hizmetler {
      margin-top: var(--space-4);
      padding-top: var(--space-4);
      border-top: 1px solid var(--color-border);
      font-size: var(--font-size-xs);
      color: var(--color-text-2);
    }
    .randevu-karti__hizmetler-baslik {
      font-weight: var(--font-weight-semibold);
      color: var(--color-text-3);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: var(--space-2);
    }
    .randevu-karti__hizmet-item {
      display: flex;
      justify-content: space-between;
      padding-block: 2px;
    }
    .randevu-karti__iptal-neden {
      margin-top: var(--space-3);
      background: var(--color-danger-bg);
      border: 1px solid rgba(224,84,84,.2);
      border-radius: var(--radius-md);
      padding: var(--space-3);
      font-size: var(--font-size-xs);
      color: var(--color-danger);
    }
    @media (max-width: 600px) {
      .randevu-karti__body { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<nav class="appt-nav" aria-label="Sayfa navigasyonu">
  <a href="index.html" class="appt-nav__logo">
    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><line x1="20" y1="4" x2="8.12" y2="15.88"/><line x1="14.47" y1="14.48" x2="20" y2="20"/><line x1="8.12" y1="8.12" x2="12" y2="12"/></svg>
    KuaförRandevu
  </a>
  <div class="appt-nav__right">
    <span class="appt-nav__user" id="nav-kullanici-ad"></span>
    <a href="musteri-profil.html" class="btn btn-ghost btn-sm">Profilim</a>
    <button class="btn btn-ghost btn-sm" id="btn-cikis">Çıkış</button>
  </div>
</nav>

<div class="page-wrap">
  <h1 class="page-title">Randevularım</h1>

  <div style="display:flex;gap:var(--space-2);margin-bottom:var(--space-6);flex-wrap:wrap;">
    <button class="btn btn-primary btn-sm" id="f-tumü"   onclick="filtreUygula('tumu')">Tümü</button>
    <button class="btn btn-ghost btn-sm"   id="f-aktif"  onclick="filtreUygula('aktif')">Aktif</button>
    <button class="btn btn-ghost btn-sm"   id="f-gecmis" onclick="filtreUygula('gecmis')">Geçmiş</button>
  </div>

  <div id="randevu-listesi">
    <div class="loading-row" style="padding:var(--space-8) 0;">
      <span class="spinner"></span><span>Randevular yükleniyor…</span>
    </div>
  </div>
</div>

<div id="toast-container"></div>

<script src="assets/js/icons.js"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/randevularim.js"></script>
</body>
</html>
